sandbox_mode = "danger-full-access"
approval_policy = "on-request"

[mcp_servers.godot-mcp]
url = "http://localhost:19080/mcp"
enabled = true

[mcp_servers.figma-desktop]
url = "http://127.0.0.1:3845/mcp"

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]
startup_timeout_sec = 120.0

[mcp_servers.codegraph.tools.codegraph_explore]
approval_mode = "approve"

[mcp_servers.codegraph.tools.codegraph_node]
approval_mode = "approve"

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp", "--api-key", "ctx7sk-62fe0b79-f5c0-4a81-8968-6c2918317796"]

[mcp_servers.postgres]
command = "/home/user/.nvm/versions/node/v24.17.0/bin/npx"
args = [
  "-y",
  "@modelcontextprotocol/server-postgres",
  "postgresql://postgres:postgres@127.0.0.1:5433/qqfarm?sslmode=disable"
]
startup_timeout_sec = 120

[mcp_servers.postgres.tools.query]
approval_mode = "approve"

[mcp_servers.RedisMCPServer]
command = "uvx"
args = [
  "--from",
  "redis-mcp-server@latest",
  "redis-mcp-server",
  "--url",
  "redis://127.0.0.1:6380/0"
]

[mcp_servers.RedisMCPServer.tools.dbsize]
approval_mode = "approve"

[mcp_servers.RedisMCPServer.tools.scan_all_keys]
approval_mode = "approve"



[mcp_servers.godot-mcp.tools.simulate_runtime_input_event]
approval_mode = "approve"

[mcp_servers.godot-mcp.tools.clear_output]
approval_mode = "approve"

[sandbox_workspace_write]
network_access = true
